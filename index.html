<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viktor's Movie Watchlist</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="page">
    <h1 class="page-title">Movie Watchlist</h1>
    <h3 class="page-subtitle">Let's add a movie!</h3>
    <form id="form" class="movie-form" action="">
        <div class="form-row">
            <label class="form-label" for="typeTitle"></label>
            <input id="typeTitle" class="form-input" type="text">

            <label class="form-label" for="selectGenre">Genre:</label>
            <select id="selectGenre" class="form-select" name="selectGenre">
                <option value="">Choose a genre</option>
                <option value="horror">Horror</option>
                <option value="sci-fi">Science Fiction</option>
                <option value="historicalFiction">Historical Fiction</option>
                <option value="rom-com">Romantic Comedy</option>
            </select>

            <button id="addMovie" class="add-button" type="submit">Add Movie</button>
        </div>

        <div class="form-message-wrap">
            <p id="formMessage" class="form-message"></p>
        </div>

    </form>
    <div class="list-section">
        <ul id="movies" class="movie-list"></ul>
        <p id="emptyMessage" class="empty-message"></p>
    </div>
</body>

</html>
